<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>싱싱마켓</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">

  <style>
    /* ─── Tokens ─────────────────────────────────────────────────── */
    :root {
      --bg:         #F6F8FA;
      --surface:    #FFFFFF;
      --blue:       #3274C5;
      --blue-deep:  #255FA8;
      --blue-soft:  #EDF5FF;
      --green:      #35B779;
      --green-soft: #EAF8F1;
      --ink:        #202A36;
      --sub:        #8995A3;
      --faint:      #B8C1CC;
      --border:     #E4E9EF;
      --red:        #E64A4A;
      --orange:     #F07030;
      --card-r:     18px;
      --pill-r:     999px;
      --shadow:     0 2px 8px rgba(32,42,54,.055);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:         #10131E;
        --surface:    #181C2C;
        --blue-soft:  #111D3A;
        --green-soft: #0E2A1C;
        --ink:        #DDE1F0;
        --sub:        #6E748C;
        --faint:      #3A3F55;
        --border:     #252A3D;
        --shadow:     0 2px 10px rgba(0,0,0,.28);
      }
    }
    :root[data-theme="dark"] {
      --bg:         #10131E;
      --surface:    #181C2C;
      --blue-soft:  #111D3A;
      --green-soft: #0E2A1C;
      --ink:        #DDE1F0;
      --sub:        #6E748C;
      --faint:      #3A3F55;
      --border:     #252A3D;
      --shadow:     0 2px 10px rgba(0,0,0,.28);
    }

    /* ─── Reset ──────────────────────────────────────────────────── */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Noto Sans KR',sans-serif;
      background:var(--bg); color:var(--ink);
      min-height:100vh; font-size:14px; line-height:1.5;
      padding-bottom:88px;
    }
    button{cursor:pointer;font-family:inherit;border:none}

    /* ─── Header ─────────────────────────────────────────────────── */
    .header{
      position:sticky;top:0;z-index:80;
      background:var(--surface);
      padding:12px 16px;
      display:flex;align-items:center;gap:10px;
      box-shadow:0 1px 0 rgba(228,233,239,.7);
    }
    .header-logo{display:flex;align-items:center;gap:8px}
    .header-icon{
      width:38px;height:38px;border-radius:12px;
      background:var(--blue-soft);border:1px solid #E1EBF6;
      display:grid;place-items:center;font-size:17px;flex-shrink:0;
    }
    .header-name{font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
    .header-gap{flex:1}
    .conn-badge{
      display:flex;align-items:center;gap:5px;
      background:var(--green-soft);border:1.5px solid rgba(46,197,126,.3);
      border-radius:var(--pill-r);padding:5px 11px;
      font-size:11px;font-weight:700;color:var(--green);
      white-space:nowrap;
    }
    .conn-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:conn-pulse 2s infinite}
    @keyframes conn-pulse{0%,100%{opacity:1}50%{opacity:.3}}

    /* ─── Search ─────────────────────────────────────────────────── */
    .search-wrap{
      background:var(--surface);padding:4px 16px 12px;
      box-shadow:0 1px 0 rgba(228,233,239,.7);
      position:sticky;top:54px;z-index:78;
    }
    .search-box{
      display:flex;align-items:center;gap:8px;
      background:#F7F9FB;border:1px solid var(--border);
      border-radius:15px;padding:12px 14px;
      font-size:14px;color:var(--sub);font-weight:500;
    }

    /* ─── Category tabs ──────────────────────────────────────────── */
    .cat-wrap{
      background:var(--surface);
      padding:10px 16px 12px;
      box-shadow:0 1px 0 rgba(228,233,239,.7);
      position:sticky;top:118px;z-index:76;
    }
    .cats{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
    .cats::-webkit-scrollbar{display:none}
    .cat{
      flex-shrink:0;padding:7px 16px;border-radius:var(--pill-r);
      background:#F7F9FB;border:1px solid var(--border);
      color:var(--sub);font-size:13px;font-weight:600;
      transition:all .14s;white-space:nowrap;
    }
    .cat.active{background:var(--blue);border-color:var(--blue);color:#fff}

    /* ─── Section header ─────────────────────────────────────────── */
    .section-head{
      padding:16px 16px 10px;
      display:flex;align-items:center;justify-content:space-between;
    }
    .section-title{font-size:15px;font-weight:700;color:var(--ink)}
    .section-more{font-size:12px;color:var(--sub);font-weight:500}

    /* ─── Product grid ───────────────────────────────────────────── */
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 12px}

    /* ─── Product card ───────────────────────────────────────────── */
    .card{background:var(--surface);border-radius:var(--card-r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
    .card-thumb{position:relative;background:var(--bg);height:120px;display:grid;place-items:center;font-size:56px}
    .card-badge{
      position:absolute;top:8px;left:8px;
      font-size:10px;font-weight:700;letter-spacing:.02em;
      border-radius:var(--pill-r);padding:3px 9px;white-space:nowrap;
    }
    .badge-blue  {background:var(--blue);color:#fff}
    .badge-orange{background:var(--orange);color:#fff}
    .badge-green {background:var(--green);color:#fff}
    .card-body{padding:12px 12px 13px;flex:1;display:flex;flex-direction:column;gap:3px}
    .card-farm{font-size:11px;color:var(--sub);font-weight:500}
    .card-name{font-size:15px;font-weight:700;color:var(--ink);line-height:1.2}
    .card-info{font-size:11px;color:var(--sub)}
    .card-price{margin-top:5px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
    .price-sale{font-size:16px;font-weight:800;color:var(--red);font-variant-numeric:tabular-nums}
    .price-orig{font-size:12px;color:var(--faint);text-decoration:line-through;font-variant-numeric:tabular-nums}
    .price-base{font-size:16px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
    .card-action{margin-top:10px}

    /* ─── Add button / Stepper ───────────────────────────────────── */
    .btn-add{
      width:100%;padding:11px;border-radius:11px;
      background:var(--blue);color:#fff;
      font-size:14px;font-weight:750;
      transition:background .14s, transform .1s;
    }
    .btn-add:hover{background:var(--blue-deep)}
    .btn-add:active{transform:scale(.97)}
    .stepper{
      width:100%;height:40px;border-radius:10px;
      border:1.5px solid var(--blue);
      display:flex;align-items:center;justify-content:space-between;
      background:var(--surface);
    }
    .stepper-btn{
      width:40px;height:100%;
      display:grid;place-items:center;
      font-size:20px;font-weight:700;color:var(--blue);
      background:transparent;transition:background .12s;border-radius:9px;
    }
    .stepper-btn:hover{background:var(--blue-soft)}
    .stepper-num{font-size:15px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}

    /* ─── Checkout bar ───────────────────────────────────────────── */
    .checkout-bar{
      position:fixed;bottom:0;inset-inline:0;z-index:100;
      padding:11px 16px 18px;
      background:var(--surface);
      border-top:1px solid rgba(228,233,239,.9);
      box-shadow:0 -4px 20px rgba(26,30,46,.08);
      transform:translateY(110%);
      transition:transform .28s cubic-bezier(.22,1,.36,1);
    }
    .checkout-bar.visible{transform:none}
    .checkout-btn{
      width:100%;padding:15px;border-radius:14px;
      background:var(--blue);color:#fff;
      font-size:16px;font-weight:800;
      display:flex;align-items:center;justify-content:center;gap:10px;
      transition:background .14s;
    }
    .checkout-btn:hover{background:var(--blue-deep)}
    .checkout-count{
      background:rgba(255,255,255,.25);border-radius:var(--pill-r);
      padding:2px 9px;font-size:13px;font-weight:800;
    }

    /* ─── Modals ─────────────────────────────────────────────────── */
    .overlay{
      position:fixed;inset:0;z-index:200;
      background:rgba(10,12,22,.55);backdrop-filter:blur(5px);
      display:grid;place-items:center;padding:24px;
      opacity:0;pointer-events:none;transition:opacity .22s;
    }
    .overlay.open{opacity:1;pointer-events:all}
    .modal{
      background:var(--surface);border-radius:22px;
      padding:28px 20px 20px;width:100%;max-width:340px;
      box-shadow:0 20px 60px rgba(10,12,22,.22);
      transform:translateY(12px) scale(.97);
      transition:transform .25s cubic-bezier(.22,1,.36,1);
    }
    .overlay.open .modal{transform:none}

    /* Payment complete */
    .pay-check{width:54px;height:54px;border-radius:50%;background:var(--blue-soft);display:grid;place-items:center;margin:0 auto 16px;font-size:26px}
    .pay-title{font-size:18px;font-weight:800;color:var(--ink);text-align:center}
    .pay-sub{font-size:13px;color:var(--sub);text-align:center;margin-top:6px;line-height:1.6}
    .pay-sub strong{color:var(--green);font-weight:700}
    .pay-product{background:var(--bg);border-radius:12px;padding:12px 14px;margin:16px 0;display:flex;align-items:center;gap:10px}
    .pay-emoji{font-size:28px;flex-shrink:0}
    .pay-info{flex:1}
    .pay-name{font-size:14px;font-weight:700;color:var(--ink)}
    .pay-detail{font-size:11px;color:var(--sub);margin-top:2px}
    .pay-arrow{color:var(--faint);font-size:18px;flex-shrink:0}
    .modal-actions{display:flex;gap:9px;margin-top:4px}
    .btn-later{flex:1;padding:13px;border-radius:12px;background:var(--bg);color:var(--sub);font-size:14px;font-weight:600;transition:background .14s}
    .btn-later:hover{background:var(--border)}
    .btn-fridge{flex:2;padding:13px;border-radius:12px;background:var(--green);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px;transition:background .14s}
    .btn-fridge:hover{background:#22A068}
    .btn-fridge:disabled{opacity:.6;pointer-events:none}

    /* Syncing modal */
    .sync-icons{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:20px}
    .sync-icon{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:26px;border:1.5px solid var(--border);background:var(--bg)}
    .sync-dots{display:flex;gap:5px}
    .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:sync-blink 1s infinite}
    .sync-dot:nth-child(2){animation-delay:.2s}
    .sync-dot:nth-child(3){animation-delay:.4s}
    @keyframes sync-blink{0%,100%{opacity:.2}50%{opacity:1}}
    .sync-title{font-size:18px;font-weight:800;color:var(--ink);text-align:center}
    .sync-sub{font-size:13px;color:var(--sub);text-align:center;margin-top:6px}

    /* ─── Toast ──────────────────────────────────────────────────── */
    .toasts{position:fixed;bottom:100px;inset-inline:0;z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
    .toast{
      display:flex;align-items:center;gap:8px;
      background:var(--ink);color:#E8F0EC;
      border-radius:var(--pill-r);padding:10px 18px;
      font-size:13px;font-weight:650;
      box-shadow:0 4px 20px rgba(0,0,0,.22);
      opacity:0;transform:translateY(5px) scale(.97);
      transition:opacity .2s,transform .2s;white-space:nowrap;
    }
    .toast.show{opacity:1;transform:none}
    .toast-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}

    /* ─── Responsive ─────────────────────────────────────────────── */
    @media(min-width:500px){body{max-width:430px;margin-inline:auto;box-shadow:0 0 40px rgba(0,0,0,.12)}}
    @media(max-width:360px){.grid{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

    /* ─── Visual polish ───────────────────────────────────────────── */
    .header, .search-wrap, .cat-wrap {
      backdrop-filter: blur(12px);
    }
    .header-name { letter-spacing:-.025em; }
    .search-box { color:#8A96A3; }
    .cat { transition:transform .12s, background .14s, border-color .14s; }
    .cat:active { transform:scale(.97); }
    .cat.active { box-shadow:0 3px 8px rgba(50,116,197,.16); }
    .card { transition:transform .14s, box-shadow .14s; }
    .card:active { transform:scale(.992); }
    .btn-add, .checkout-btn {
      box-shadow:0 4px 10px rgba(50,116,197,.14);
    }
    .checkout-btn { border-radius:15px; }
    .card-badge { box-shadow:0 2px 5px rgba(0,0,0,.08); }

  </style>
</head>
<body>

<!-- Firebase 9 compat -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-database-compat.min.js"></script>

<!-- ── Header ── -->
<header class="header">

    <div class="header-icon">🛒</div>
    <span class="header-name">싱싱마켓</span>

  <div class="conn-badge">
    <div class="conn-dot"></div>
    모아밥 연동중

<!-- ── Search ── -->
<div class="search-wrap">

<!-- ── Category tabs ── -->
<div class="cat-wrap">

  </div>
</div>

<!-- ── Product sections ── -->
<div id="content"></div>

<!-- ── Checkout bar ── -->
<div class="checkout-bar" id="checkoutBar">
  <button class="checkout-btn" id="checkoutBtn" onclick="openPayModal()">
    <span class="checkout-count" id="cartCountEl">0</span>
    <span id="cartTotalEl">0원</span> 결제하기
  </button>
</div>

<!-- ── Payment complete modal ── -->
<div class="overlay" id="payOverlay">
  <div class="modal" id="payModal">
    <div class="pay-check">✓</div>
    <div class="pay-title">결제가 완료됐어요</div>
    <div class="pay-sub">구매한 <strong id="pItemCount">0</strong>개 상품을<br>모아밥 마이 냉장고에 넣을까요?</div>
    <div class="pay-product" id="payProduct"></div>
    <div class="modal-actions">
      <button class="btn-later" onclick="closePayModal()">나중에</button>
      <button class="btn-fridge" id="fridgeBtn" onclick="sendToFridge()">🔒 마이 냉장고에 넣기</button>
    </div>
  </div>
</div>

<!-- ── Syncing modal ── -->
<div class="overlay" id="syncOverlay">
  <div class="modal">
    <div class="sync-icons">
      <div class="sync-icon">🛒</div>
      <div class="sync-dots">
        <div class="sync-dot"></div>
        <div class="sync-dot"></div>
        <div class="sync-dot"></div>
      </div>
      <div class="sync-icon">🍱</div>
    </div>
    <div class="sync-title">모아밥으로 전송 중</div>
    <div class="sync-sub">재고 목록에 자동으로 채워집니다</div>
  </div>
</div>

<!-- ── Toasts ── -->
<div class="toasts" id="toasts"></div>

<script>

    // 유제품
    { id:'d1', emoji:'🥚', name:'무항생제 계란',   farm:'한들목장', cat:'유제품',info:'10구 · 소비기한 14일', price:7200, orig:null,  expDays:14, loc:'냉장 도어',  fbCat:'DAIRY',     badge:null, badgeClass:'' },
    { id:'d2', emoji:'🥛', name:'제주 우유',       farm:'제주축협', cat:'유제품',info:'900ml · 소비기한 7일', price:3200, orig:3800,  expDays:7,  loc:'냉장 도어',  fbCat:'DAIRY',     badge:'산지직송', badgeClass:'badge-blue'  },
    // 곡물
    { id:'g1', emoji:'🌾', name:'햅쌀 5kg',       farm:'황금들판', cat:'곡물', info:'5kg · 소비기한 180일',  price:18500,orig:null,  expDays:180,loc:'실온',       fbCat:'GRAIN',     badge:null, badgeClass:'' },
  ];

  const SECTIONS = [
    { key:'fresh', label:'오늘 신선 도착', ids:['v1','f1','m1','s1'] },
    { key:'sale',  label:'지금 할인 중',   ids:['f3','m1','d2','f1'] },
    { key:'all',   label:'전체 상품',      ids:PRODUCTS.map(p=>p.id) },
  ];

  /* ─── Cart state ─────────────────────────────────────────────── */
  const cart = {};
  let db = null, activeCat = 'all';

  /* ─── Firebase init ──────────────────────────────────────────── */
  function initFirebase() {
    if (FB_CONFIG.apiKey === 'YOUR_API_KEY') return; // 설정 전에는 건너뜀
    try {
      firebase.initializeApp(FB_CONFIG);
      db = firebase.database();
    } catch(e) { console.warn('Firebase:', e.message); }
  }

  /* ─── Render ─────────────────────────────────────────────────── */
  function filteredProducts() {
    return activeCat === 'all' ? PRODUCTS : PRODUCTS.filter(p => p.cat === activeCat);
  }

  function renderContent() {
    const el = document.getElementById('content');
    if (activeCat !== 'all') {
      const items = filteredProducts();
      el.innerHTML = sectionHTML(`${activeCat} (${items.length}종)`, items);
    } else {
      el.innerHTML = SECTIONS.map(sec => {
        const items = sec.ids.map(id => PRODUCTS.find(p => p.id === id)).filter(Boolean);
        return sectionHTML(sec.label, items);
      }).join('');
    }
  }

  function sectionHTML(title, items) {
    return `
      <div class="section-head">
        <span class="section-title">${title}</span>
        <span class="section-more">전체보기 ›</span>
      </div>
      <div class="grid">${items.map(cardHTML).join('')}</div>`;
  }

  function cardHTML(p) {
    const inCart   = cart[p.id] || 0;
    const priceHTML = p.orig
      ? `<span class="price-sale">${p.price.toLocaleString()}원</span><span class="price-orig">${p.orig.toLocaleString()}원</span>`
      : `<span class="price-base">${p.price.toLocaleString()}원</span>`;
    const action = inCart > 0
      ? `<div class="stepper">
           <button class="stepper-btn" onclick="changeQty('${p.id}',-1)">−</button>
           <span class="stepper-num" id="num-${p.id}">${inCart}</span>
           <button class="stepper-btn" onclick="changeQty('${p.id}',+1)">＋</button>
         </div>`
      : `<button class="btn-add" onclick="addToCart('${p.id}')">담기</button>`;
    return `
      <div class="card">
        <div class="card-thumb">
          ${p.badge ? `<span class="card-badge ${p.badgeClass}">${p.badge}</span>` : ''}
          ${p.emoji}
        </div>
        <div class="card-body">
          <div class="card-farm">${p.farm}</div>
          <div class="card-name">${p.name}</div>
          <div class="card-info">${p.info}</div>
          <div class="card-price">${priceHTML}</div>
          <div class="card-action" id="action-${p.id}">${action}</div>
        </div>
      </div>`;
  }

  /* ─── Cart logic ─────────────────────────────────────────────── */
  function addToCart(id) {
    cart[id] = 1;
    updateCardAction(id);
    updateBar();
  }

  function changeQty(id, delta) {
    const next = (cart[id] || 0) + delta;
    if (next <= 0) { delete cart[id]; updateCardAction(id); }
    else {
      cart[id] = next;
      const el = document.getElementById(`num-${id}`);
      if (el) el.textContent = next;
    }
    updateBar();
  }

  function updateCardAction(id) {
    const p  = PRODUCTS.find(x => x.id === id);
    const el = document.getElementById(`action-${id}`);
    if (!el || !p) return;
    const q = cart[id] || 0;
    el.innerHTML = q > 0
      ? `<div class="stepper">
           <button class="stepper-btn" onclick="changeQty('${id}',-1)">−</button>
           <span class="stepper-num" id="num-${id}">${q}</span>
           <button class="stepper-btn" onclick="changeQty('${id}',+1)">＋</button>
         </div>`
      : `<button class="btn-add" onclick="addToCart('${id}')">담기</button>`;
  }

  function updateBar() {
    const ids   = Object.keys(cart);
    const count = ids.reduce((s,id) => s + cart[id], 0);
    const total = ids.reduce((s,id) => {
      const p = PRODUCTS.find(x => x.id === id);
      return s + (p ? p.price * cart[id] : 0);
    }, 0);
    document.getElementById('cartCountEl').textContent = count;
    document.getElementById('cartTotalEl').textContent = total.toLocaleString() + '원';
    document.getElementById('checkoutBar').classList.toggle('visible', count > 0);
  }

  /* ─── Payment modal ──────────────────────────────────────────── */
  function openPayModal() {
    const ids = Object.keys(cart);
    if (!ids.length) return;
    const count  = ids.reduce((s,id) => s + cart[id], 0);
    const firstP = PRODUCTS.find(x => x.id === ids[0]);
    document.getElementById('pItemCount').textContent = count;
    document.getElementById('payProduct').innerHTML = `
      <span class="pay-emoji">${firstP.emoji}</span>
      <div class="pay-info">
        <div class="pay-name">${firstP.name}</div>
        <div class="pay-detail">${firstP.info}${count > 1 ? ` 외 ${count-1}개` : ''}</div>
      </div>
      <span class="pay-arrow">›</span>`;
    const btn = document.getElementById('fridgeBtn');
    btn.disabled = false;
    btn.textContent = '🔒 마이 냉장고에 넣기';
    document.getElementById('payOverlay').classList.add('open');
  }

  function closePayModal() {
    document.getElementById('payOverlay').classList.remove('open');
  }

  async function sendToFridge() {
    document.getElementById('fridgeBtn').disabled = true;
    closePayModal();
    document.getElementById('syncOverlay').classList.add('open');

    const today = new Date();
    const fmt   = d => d.toISOString().slice(0,10);

    try {
      await Promise.all(Object.keys(cart).map(async id => {
        const p = PRODUCTS.find(x => x.id === id);
        if (!p) return;
        const expiry = new Date(today);
        expiry.setDate(today.getDate() + p.expDays);
        const item = {
          name:       p.name,
          category:   p.fbCat,
          expiry:     fmt(expiry),
          qty:        `${cart[id]}개`,
          location:   p.loc,
          addedDays:  0,
          isAllergen: false,
          source:     'market',
          addedAt:    fmt(today),
        };
        if (db) await db.ref('eatda/inventory').push(item);
      }));
      if (!db) await new Promise(r => setTimeout(r, 1400));
    } catch(e) { console.error(e); }

    const count = Object.keys(cart).reduce((s,id) => s + cart[id], 0);
    Object.keys(cart).forEach(k => delete cart[k]);
    renderContent();
    updateBar();

    setTimeout(() => {
      document.getElementById('syncOverlay').classList.remove('open');
      toast(`🧊 ${count}개 식재료가 냉장고에 추가됐어요`);
    }, 1500);
  }

  /* ─── Toast ──────────────────────────────────────────────────── */
  function toast(msg) {
    const wrap = document.getElementById('toasts');
    const el   = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `<span class="toast-dot"></span>${msg}`;
    wrap.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 250); }, 3000);
  }

  /* ─── Category filter ───────────────────────────────────────── */
  document.getElementById('cats').addEventListener('click', e => {
    const btn = e.target.closest('.cat');
    if (!btn) return;
    document.querySelectorAll('.cat').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    renderContent();
  });

  /* ─── Boot ───────────────────────────────────────────────────── */
  initFirebase();
  renderContent();
</script>

</body>
</html>
